<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#081126" />
      <stop offset="100%" stop-color="#03050e" />
    </linearGradient>

    <!-- Domain Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1733" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="amberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .mono-font { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .tag-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="url(#radarBg)" stroke="#1a2b4c" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" class="title-font" font-size="16" letter-spacing="1px" fill="#00f5ff">CORE ARCHITECTURAL RADAR // PRODUCTION PROFICIENCY MATRIX</text>
    <text x="952" y="0" text-anchor="end" class="mono-font" font-size="11" fill="#64748b">AUDITED &amp; PRODUCTION VERIFIED</text>
  </g>

  <!-- 4 Competency Columns -->
  <!-- COLUMN 1: Spatial 3D & Graphics -->
  <g transform="translate(24, 46)">
    <rect width="224" height="170" rx="10" fill="url(#cardGrad1)" stroke="#162e54" stroke-width="1.2" />
    <!-- Header -->
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#00f5ff" />
    <text x="26" y="22" class="title-font" font-size="13" fill="#38bdf8">Spatial 3D &amp; Graphics</text>
    <!-- Meter -->
    <rect x="12" y="34" width="200" height="4" rx="2" fill="#0e1f3a" />
    <rect x="12" y="34" width="192" height="4" rx="2" fill="url(#cyanLine)" filter="url(#subtleGlow)" />
    <!-- Tech List -->
    <g transform="translate(12, 54)">
      <text x="0" y="14" class="tag-font" fill="#cbd5e1">• Three.js (WebGL 2.0 / WebGPU)</text>
      <text x="0" y="34" class="tag-font" fill="#cbd5e1">• React Three Fiber (R3F)</text>
      <text x="0" y="54" class="tag-font" fill="#cbd5e1">• GLSL Procedural Shaders</text>
      <text x="0" y="74" class="tag-font" fill="#cbd5e1">• Parametric 3D CAD Engines</text>
      <text x="0" y="94" class="mono-font" font-size="10" font-weight="700" fill="#00f5ff">LEVEL: 96% // MASTERY</text>
    </g>
  </g>

  <!-- COLUMN 2: Full-Stack SaaS & Edge -->
  <g transform="translate(268, 46)">
    <rect width="224" height="170" rx="10" fill="url(#cardGrad1)" stroke="#162e54" stroke-width="1.2" />
    <!-- Header -->
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#34d399" />
    <text x="26" y="22" class="title-font" font-size="13" fill="#34d399">Full-Stack SaaS &amp; Edge</text>
    <!-- Meter -->
    <rect x="12" y="34" width="200" height="4" rx="2" fill="#0e1f3a" />
    <rect x="12" y="34" width="196" height="4" rx="2" fill="url(#greenLine)" filter="url(#subtleGlow)" />
    <!-- Tech List -->
    <g transform="translate(12, 54)">
      <text x="0" y="14" class="tag-font" fill="#cbd5e1">• TypeScript 5.8 &amp; React 19</text>
      <text x="0" y="34" class="tag-font" fill="#cbd5e1">• Next.js 15 &amp; TanStack</text>
      <text x="0" y="54" class="tag-font" fill="#cbd5e1">• Cloudflare Edge Workers</text>
      <text x="0" y="74" class="tag-font" fill="#cbd5e1">• PostgreSQL, Supabase, Redis</text>
      <text x="0" y="94" class="mono-font" font-size="10" font-weight="700" fill="#34d399">LEVEL: 98% // ARCHITECT</text>
    </g>
  </g>

  <!-- COLUMN 3: Autonomous AI & RAG -->
  <g transform="translate(512, 46)">
    <rect width="224" height="170" rx="10" fill="url(#cardGrad1)" stroke="#162e54" stroke-width="1.2" />
    <!-- Header -->
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#c084fc" />
    <text x="26" y="22" class="title-font" font-size="13" fill="#c084fc">Autonomous AI &amp; RAG</text>
    <!-- Meter -->
    <rect x="12" y="34" width="200" height="4" rx="2" fill="#0e1f3a" />
    <rect x="12" y="34" width="188" height="4" rx="2" fill="url(#purpleLine)" filter="url(#subtleGlow)" />
    <!-- Tech List -->
    <g transform="translate(12, 54)">
      <text x="0" y="14" class="tag-font" fill="#cbd5e1">• On-Device WebLLM Models</text>
      <text x="0" y="34" class="tag-font" fill="#cbd5e1">• TF-IDF Vector RAG Engines</text>
      <text x="0" y="54" class="tag-font" fill="#cbd5e1">• Multi-Agent Orchestration</text>
      <text x="0" y="74" class="tag-font" fill="#cbd5e1">• OpenAI API &amp; ChromaDB</text>
      <text x="0" y="94" class="mono-font" font-size="10" font-weight="700" fill="#c084fc">LEVEL: 94% // ADVANCED</text>
    </g>
  </g>

  <!-- COLUMN 4: Defensive Cyber & SOC -->
  <g transform="translate(756, 46)">
    <rect width="224" height="170" rx="10" fill="url(#cardGrad1)" stroke="#162e54" stroke-width="1.2" />
    <!-- Header -->
    <rect x="12" y="14" width="8" height="8" rx="2" fill="#fbbf24" />
    <text x="26" y="22" class="title-font" font-size="13" fill="#fbbf24">Defensive Cyber &amp; SOC</text>
    <!-- Meter -->
    <rect x="12" y="34" width="200" height="4" rx="2" fill="#0e1f3a" />
    <rect x="12" y="34" width="190" height="4" rx="2" fill="url(#amberLine)" filter="url(#subtleGlow)" />
    <!-- Tech List -->
    <g transform="translate(12, 54)">
      <text x="0" y="14" class="tag-font" fill="#cbd5e1">• Real-Time EDR Telemetry</text>
      <text x="0" y="34" class="tag-font" fill="#cbd5e1">• Hardware DRM Anti-Piracy</text>
      <text x="0" y="54" class="tag-font" fill="#cbd5e1">• Isolation Forest ML Anomaly</text>
      <text x="0" y="74" class="tag-font" fill="#cbd5e1">• Zero-Trust mTLS &amp; OWASP</text>
      <text x="0" y="94" class="mono-font" font-size="10" font-weight="700" fill="#fbbf24">LEVEL: 95% // SEC-OP</text>
    </g>
  </g>
</svg>