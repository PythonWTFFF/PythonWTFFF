<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="auto" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="slaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e" />
      <stop offset="50%" stop-color="#09122a" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="slaCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b38" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060c1c" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="slaCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="slaEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="slaPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="slaAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.9); }
    }
    .sla-live { animation: pulseLive 2s infinite ease-in-out; transform-origin: 30px 25px; }
    .sla-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #00f5ff; }
    .pillar-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; }
    .pillar-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.5px; }
    .pillar-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 400; fill: #94a3b8; }
    .pillar-sla { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="180" rx="12" fill="url(#slaBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#00f5ff" stroke-width="1.8" />
  <path d="M 986 26 L 986 14 L 974 14" fill="none" stroke="#00f5ff" stroke-width="1.8" />
  <path d="M 14 154 L 14 166 L 26 166" fill="none" stroke="#00f5ff" stroke-width="1.8" />
  <path d="M 986 154 L 986 166 L 974 166" fill="none" stroke="#00f5ff" stroke-width="1.8" />

  <!-- Header -->
  <g transform="translate(30, 26)">
    <circle cx="0" cy="0" r="4.5" fill="#10b981" class="sla-live" />
    <text x="14" y="4" class="sla-title">🤝 ENTERPRISE CLIENT COMMITMENTS // VERIFIED ARCHITECTURAL SLA</text>
    <text x="940" y="4" text-anchor="end" class="sla-title" fill="#a855f7">ZERO COMPROMISE • COMMERCIAL READY</text>
  </g>
  <line x1="26" y1="40" x2="974" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- 4 PILLARS -->

  <!-- Pillar 1: High-Velocity Delivery -->
  <g transform="translate(26, 52)">
    <rect width="224" height="114" rx="8" fill="url(#slaCardGrad)" stroke="#0e3a5f" stroke-width="1.2" />
    <text x="14" y="24" class="pillar-num" fill="#00f5ff">01 // VELOCITY</text>
    <text x="14" y="44" class="pillar-title">14-Day MVP Turnkey</text>
    <text x="14" y="64" class="pillar-desc">0-to-1 production architecture</text>
    <text x="14" y="79" class="pillar-desc">deployed with automated CI/CD.</text>
    <text x="14" y="100" class="pillar-sla" fill="#38bdf8">● 100% SPRINT DELIVERY</text>
  </g>

  <!-- Pillar 2: Fortress Defense -->
  <g transform="translate(264, 52)">
    <rect width="224" height="114" rx="8" fill="url(#slaCardGrad)" stroke="#0e3a5f" stroke-width="1.2" />
    <text x="14" y="24" class="pillar-num" fill="#10b981">02 // DEFENSE</text>
    <text x="14" y="44" class="pillar-title">OWASP &amp; Zero-Trust</text>
    <text x="14" y="64" class="pillar-desc">Post-quantum mTLS, anti-tamper</text>
    <text x="14" y="79" class="pillar-desc">DRM &amp; automated rate limiting.</text>
    <text x="14" y="100" class="pillar-sla" fill="#34d399">● 0 AUDIT DEFECTS</text>
  </g>

  <!-- Pillar 3: Real-Time Performance -->
  <g transform="translate(502, 52)">
    <rect width="224" height="114" rx="8" fill="url(#slaCardGrad)" stroke="#0e3a5f" stroke-width="1.2" />
    <text x="14" y="24" class="pillar-num" fill="#a855f7">03 // REAL-TIME</text>
    <text x="14" y="44" class="pillar-title">60 FPS &amp; Sub-40ms</text>
    <text x="14" y="64" class="pillar-desc">Locked WebGPU spatial frame</text>
    <text x="14" y="79" class="pillar-desc">rates &amp; anycast edge mesh.</text>
    <text x="14" y="100" class="pillar-sla" fill="#c084fc">● AUDITED 99.99% UPTIME</text>
  </g>

  <!-- Pillar 4: Sovereign Ownership -->
  <g transform="translate(740, 52)">
    <rect width="234" height="114" rx="8" fill="url(#slaCardGrad)" stroke="#0e3a5f" stroke-width="1.2" />
    <text x="14" y="24" class="pillar-num" fill="#f59e0b">04 // SOVEREIGN IP</text>
    <text x="14" y="44" class="pillar-title">100% Commercial IP</text>
    <text x="14" y="64" class="pillar-desc">Zero vendor lock-in, clean Git,</text>
    <text x="14" y="79" class="pillar-desc">full documentation &amp; handoff.</text>
    <text x="14" y="100" class="pillar-sla" fill="#fbbf24">● STRICT NDA &amp; IP TRANSFER</text>
  </g>
</svg>
