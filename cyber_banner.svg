<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Deep Space Cybernetic Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050c" />
      <stop offset="35%" stop-color="#081026" />
      <stop offset="70%" stop-color="#0d1838" />
      <stop offset="100%" stop-color="#03050d" />
    </linearGradient>

    <!-- Glowing Cyan & Violet Text Gradients -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Accent Divider Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff007a" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#7928ca" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Animated Scanning Laser Beam -->
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.7; }
      100% { transform: translateY(240px); opacity: 0.1; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }
    .grid-line { stroke: #0f244a; stroke-width: 0.7; opacity: 0.55; }
    .scan-beam { animation: scanBeam 4.5s linear infinite; }
    .pulse-dot { animation: pulseGlow 1.8s ease-in-out infinite; }
    .title-text { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif; 
      font-weight: 900; 
      letter-spacing: 5px; 
      filter: drop-shadow(0 0 12px rgba(0, 245, 255, 0.4));
    }
    .mono-text { 
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; 
    }
    .hud-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
    }
    .hud-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
  </style>

  <!-- Card Background with High-Tech Cyber Border -->
  <rect width="1000" height="240" rx="14" fill="url(#bgGradient)" stroke="#1e3a5f" stroke-width="1.6" />

  <!-- Cyber Grid Lines -->
  <g>
    <!-- Vertical Grid Lines -->
    <line x1="80" y1="0" x2="80" y2="240" class="grid-line" />
    <line x1="180" y1="0" x2="180" y2="240" class="grid-line" />
    <line x1="280" y1="0" x2="280" y2="240" class="grid-line" />
    <line x1="380" y1="0" x2="380" y2="240" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="240" stroke="#00f5ff" stroke-width="0.5" stroke-dasharray="4,6" opacity="0.25" />
    <line x1="620" y1="0" x2="620" y2="240" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="240" class="grid-line" />
    <line x1="820" y1="0" x2="820" y2="240" class="grid-line" />
    <line x1="920" y1="0" x2="920" y2="240" class="grid-line" />

    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="42" x2="1000" y2="42" class="grid-line" />
    <line x1="0" y1="92" x2="1000" y2="92" class="grid-line" />
    <line x1="0" y1="142" x2="1000" y2="142" class="grid-line" />
    <line x1="0" y1="192" x2="1000" y2="192" class="grid-line" />
  </g>

  <!-- Animated Scanning Laser Beam -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#beamGradient)" stroke-width="2.5" class="scan-beam" />

  <!-- Futuristic Corner Target Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#00f5ff" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 984 32 L 984 16 L 968 16" fill="none" stroke="#00f5ff" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 16 208 L 16 224 L 32 224" fill="none" stroke="#00f5ff" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 984 208 L 984 224 L 968 224" fill="none" stroke="#00f5ff" stroke-width="2.2" stroke-linecap="round" />

  <!-- Header HUD Status Elements -->
  <g transform="translate(36, 30)">
    <rect x="0" y="-12" width="7" height="7" fill="#00f5ff" />
    <text x="14" y="-5" class="hud-label" fill="#00f5ff">NODE: //STRAXON-SECURE-GRID</text>
    <circle cx="230" cy="-9" r="4" fill="#00ff9d" class="pulse-dot" />
    <text x="242" y="-5" class="hud-label" fill="#00ff9d">OPERATIONAL</text>
  </g>

  <g transform="translate(964, 30)" text-anchor="end">
    <text x="0" y="-5" class="hud-label" fill="#cbd5e1">CLEARANCE: LEVEL-4 <tspan fill="#a855f7">[DARK_HAT]</tspan></text>
  </g>

  <!-- Hero Identity -->
  <text x="500" y="105" text-anchor="middle" fill="url(#cyanGradient)" font-size="44" class="title-text">SWARAJ PANTI</text>
  
  <text x="500" y="139" text-anchor="middle" class="mono-text" font-size="14.5" font-weight="700" letter-spacing="2.5px" fill="#38bdf8">
    [ CODENAME: &lt;dark_hat&gt; ] // FOUNDER &amp; LEAD SYSTEMS ARCHITECT @ STRAXONLABS
  </text>
  
  <text x="500" y="167" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="1px">
    Full-Stack Systems Architecture • Spatial 3D WebGL / WebGPU • Defensive SOC Telemetry • Hardware DRM
  </text>

  <!-- Accent Divider Line -->
  <line x1="160" y1="187" x2="840" y2="187" stroke="url(#accentLine)" stroke-width="1.8" />

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(500, 214)" text-anchor="middle">
    <text x="-270" y="0" class="hud-tag" fill="#38bdf8">🛡️ EDR TELEMETRY: REAL-TIME</text>
    <text x="0" y="0" class="hud-tag" fill="#c084fc">⚡ WWW.STRAXON.ONLINE: LIVE</text>
    <text x="270" y="0" class="hud-tag" fill="#34d399">🔒 ZERO-TRUST DEFENSE: ACTIVE</text>
  </g>
</svg>