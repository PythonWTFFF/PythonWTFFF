<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Glowing Cyan & Violet Text Gradients -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="45%" stop-color="#00d2e6" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff007a" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#7928ca" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(240px); opacity: 0.2; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .grid-line { stroke: #0e2242; stroke-width: 0.75; opacity: 0.5; }
    .scan-beam { animation: scanBeam 4s linear infinite; }
    .pulse-dot { animation: pulseGlow 1.8s ease-in-out infinite; }
    .title-text { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      font-weight: 900; 
      letter-spacing: 5px; 
      filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.5));
    }
    .mono-text { 
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; 
    }
    .hud-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #64748b;
    }
  </style>

  <!-- Card Background with Cyber Border -->
  <rect width="1000" height="240" rx="12" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cyber Grid Lines -->
  <g>
    <!-- Vertical Grid Lines -->
    <line x1="80" y1="0" x2="80" y2="240" class="grid-line" />
    <line x1="180" y1="0" x2="180" y2="240" class="grid-line" />
    <line x1="280" y1="0" x2="280" y2="240" class="grid-line" />
    <line x1="380" y1="0" x2="380" y2="240" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="240" class="grid-line" />
    <line x1="580" y1="0" x2="580" y2="240" class="grid-line" />
    <line x1="680" y1="0" x2="680" y2="240" class="grid-line" />
    <line x1="780" y1="0" x2="780" y2="240" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="240" class="grid-line" />

    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="45" x2="1000" y2="45" class="grid-line" />
    <line x1="0" y1="95" x2="1000" y2="95" class="grid-line" />
    <line x1="0" y1="145" x2="1000" y2="145" class="grid-line" />
    <line x1="0" y1="195" x2="1000" y2="195" class="grid-line" />
  </g>

  <!-- Animated Scanning Beam -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#beamGradient)" stroke-width="2" class="scan-beam" />

  <!-- Futuristic Corner Target Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" />
  <path d="M 984 32 L 984 16 L 968 16" fill="none" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" />
  <path d="M 16 208 L 16 224 L 32 224" fill="none" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" />
  <path d="M 984 208 L 984 224 L 968 224" fill="none" stroke="#00f5ff" stroke-width="2" stroke-linecap="round" />

  <!-- Header HUD Status Elements -->
  <g transform="translate(36, 30)">
    <rect x="0" y="-12" width="7" height="7" fill="#00f5ff" />
    <text x="14" y="-6" class="hud-label" fill="#00f5ff">NODE: //STRAXON-SECURE-GRID</text>
    <circle cx="230" cy="-9" r="3.5" fill="#00ff9d" class="pulse-dot" />
    <text x="240" y="-6" class="hud-label" fill="#00ff9d">OPERATIONAL</text>
  </g>

  <g transform="translate(964, 30)" text-anchor="end">
    <text x="0" y="-6" class="hud-label">CLEARANCE: LEVEL-4 [DARK_HAT]</text>
  </g>

  <!-- Hero Identity -->
  <text x="500" y="105" text-anchor="middle" fill="url(#cyanGradient)" font-size="44" class="title-text">SWARAJ PANTI</text>
  
  <text x="500" y="140" text-anchor="middle" class="mono-text" font-size="13.5" font-weight="700" letter-spacing="3px" fill="#38bdf8">
    [ codename: &lt;dark_hat&gt; ] // FOUNDER &amp; LEAD ARCHITECT @ STRAXONLABS
  </text>
  
  <text x="500" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="1.2px">
    Full-Stack Software Architecture • Spatial 3D WebGL / WebGPU • Defensive SOC Telemetry • Hardware DRM
  </text>

  <!-- Accent Divider Line -->
  <line x1="160" y1="188" x2="840" y2="188" stroke="url(#accentLine)" stroke-width="1.5" />

  <!-- Bottom Telemetry Badges -->
  <g transform="translate(500, 214)" text-anchor="middle">
    <text x="-260" y="0" class="hud-label" fill="#38bdf8">🛡️ EDR TELEMETRY: REAL-TIME</text>
    <text x="0" y="0" class="hud-label" fill="#a78bfa">⚡ EDGE RUNTIMES: ONLINE</text>
    <text x="260" y="0" class="hud-label" fill="#34d399">🔒 ZERO-TRUST DEFENSE: ACTIVE</text>
  </g>
</svg>
