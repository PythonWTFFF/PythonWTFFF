<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" height="auto" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e" />
      <stop offset="50%" stop-color="#080e22" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>

    <!-- Progress Fill Gradients -->
    <linearGradient id="cyanFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purpleFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="greenFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="roseFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="amberFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <filter id="barGlow">
      <feGaussianBlur stdDeviation="2" result="b1" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepGlow {
      0% { opacity: 0.75; }
      50% { opacity: 1; }
      100% { opacity: 0.75; }
    }
    .skill-bar { animation: sweepGlow 2.5s infinite ease-in-out; }
    .title-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #00f5ff; }
    .skill-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #cbd5e1; }
    .skill-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10px; font-weight: 500; fill: #64748b; }
    .skill-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; }
  </style>

  <!-- Background -->
  <rect width="1000" height="210" rx="10" fill="url(#barBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00f5ff" stroke-width="1.8" />
  <path d="M 988 24 L 988 12 L 976 12" fill="none" stroke="#00f5ff" stroke-width="1.8" />
  <path d="M 12 186 L 12 198 L 24 198" fill="none" stroke="#00f5ff" stroke-width="1.8" />
  <path d="M 988 186 L 988 198 L 976 198" fill="none" stroke="#00f5ff" stroke-width="1.8" />

  <!-- Header -->
  <g transform="translate(30, 25)">
    <circle cx="0" cy="0" r="4" fill="#00f5ff" />
    <text x="12" y="3.5" class="title-txt">⚡ ARCHITECTURAL PROFICIENCY MATRIX // CORE WEAPONRY LEVEL</text>
    <text x="940" y="3.5" text-anchor="end" class="title-txt" fill="#10b981">SOVEREIGN BENCHMARK: 100%</text>
  </g>
  <line x1="24" y1="36" x2="976" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- 5 Skill Progress Meters -->

  <!-- Skill 1: Spatial 3D -->
  <g transform="translate(30, 48)">
    <text x="0" y="10" class="skill-label">01 // SPATIAL 3D &amp; WEBGPU GLSL RAYMARCHING</text>
    <text x="350" y="10" class="skill-sub">Three.js • R3F • GLSL Shaders • Blender CAD</text>
    <text x="940" y="10" text-anchor="end" class="skill-pct" fill="#00f5ff">99% [APEX ARCHITECT]</text>
    <rect x="0" y="15" width="940" height="7" rx="3.5" fill="#0c1938" />
    <rect x="0" y="15" width="930" height="7" rx="3.5" fill="url(#cyanFill)" filter="url(#barGlow)" class="skill-bar" />
  </g>

  <!-- Skill 2: Zero-Trust Defense -->
  <g transform="translate(30, 78)">
    <text x="0" y="10" class="skill-label">02 // ZERO-TRUST CYBER DEFENSE &amp; DEFENSIVE SOC</text>
    <text x="350" y="10" class="skill-sub">Isolation Forest EDR • mTLS • OWASP Top-10 • Hardware DRM</text>
    <text x="940" y="10" text-anchor="end" class="skill-pct" fill="#f43f5e">98% [LEVEL 4 RESEARCH]</text>
    <rect x="0" y="15" width="940" height="7" rx="3.5" fill="#0c1938" />
    <rect x="0" y="15" width="920" height="7" rx="3.5" fill="url(#roseFill)" filter="url(#barGlow)" class="skill-bar" />
  </g>

  <!-- Skill 3: Autonomous AI -->
  <g transform="translate(30, 108)">
    <text x="0" y="10" class="skill-label">03 // AUTONOMOUS AI SWARMS &amp; NEURAL VECTOR RAG</text>
    <text x="350" y="10" class="skill-sub">WebLLM On-Device • TF-IDF Cosine RAG • ChromaDB • OpenAI</text>
    <text x="940" y="10" text-anchor="end" class="skill-pct" fill="#a855f7">97% [SWARM ENGINEER]</text>
    <rect x="0" y="15" width="940" height="7" rx="3.5" fill="#0c1938" />
    <rect x="0" y="15" width="910" height="7" rx="3.5" fill="url(#purpleFill)" filter="url(#barGlow)" class="skill-bar" />
  </g>

  <!-- Skill 4: Distributed Edge -->
  <g transform="translate(30, 138)">
    <text x="0" y="10" class="skill-label">04 // DISTRIBUTED EDGE &amp; SERVERLESS ANYCAST MESH</text>
    <text x="350" y="10" class="skill-sub">Cloudflare Workers • Vercel Edge • Bun • Docker • Redis</text>
    <text x="940" y="10" text-anchor="end" class="skill-pct" fill="#10b981">99% [SUB-40MS GLOBAL]</text>
    <rect x="0" y="15" width="940" height="7" rx="3.5" fill="#0c1938" />
    <rect x="0" y="15" width="930" height="7" rx="3.5" fill="url(#greenFill)" filter="url(#barGlow)" class="skill-bar" />
  </g>

  <!-- Skill 5: Full-Stack Platforms -->
  <g transform="translate(30, 168)">
    <text x="0" y="10" class="skill-label">05 // FULL-STACK SOVEREIGN PLATFORMS &amp; RUNTIMES</text>
    <text x="350" y="10" class="skill-sub">TypeScript 5.8 • React 19 • Python 3.12 • Go • PostgreSQL</text>
    <text x="940" y="10" text-anchor="end" class="skill-pct" fill="#f59e0b">100% [SOVEREIGN CITADEL]</text>
    <rect x="0" y="15" width="940" height="7" rx="3.5" fill="#0c1938" />
    <rect x="0" y="15" width="940" height="7" rx="3.5" fill="url(#amberFill)" filter="url(#barGlow)" class="skill-bar" />
  </g>
</svg>
